services:

  mariadb:
    image: mariadb:lts
    container_name: omeka-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  omeka:
    image: erseco/alpine-omeka-s:latest
    container_name: omeka
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      OMEKA_ADMIN_EMAIL: ${OMEKA_ADMIN_EMAIL}
      OMEKA_ADMIN_PASSWORD: ${OMEKA_ADMIN_PASSWORD}
      OMEKA_SITE_TITLE: ${OMEKA_SITE_TITLE}
      OMEKA_TIMEZONE: ${OMEKA_TIMEZONE:-UTC}
      OMEKA_LOCALE: ${OMEKA_LOCALE:-en_US}
      DB_HOST: mariadb
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - omeka_files:/var/www/html/volume

volumes:
  db_data:
  omeka_files:
